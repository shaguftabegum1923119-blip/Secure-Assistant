<!DOCTYPE html>
<html>
<head>
<title>SA Payment - CCTV</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:sans-serif; text-align:center; padding:15px; background:#f0f2f5; margin:0;}
.card{background:white; padding:20px; border-radius:12px; max-width:420px; margin:15px auto;}
h2{color:#0d6efd;}
.offer{background:#fff3cd; padding:10px; border-radius:8px; margin:10px 0; font-weight:bold;}
input, select{padding:12px; width:92%; margin:8px 0; border:1px solid #ccc; border-radius:6px;}
button{padding:14px; background:#25D366; color:white; border:none; border-radius:8px; width:95%; font-weight:bold; cursor:pointer;}
#amount{font-size:28px; color:#0d6efd; font-weight:bold;}
.qr{border:3px solid #0d6efd; border-radius:10px;}
</style>
</head>
<body>
<div class="card">
  <h2>SA Your Secure Assistant</h2>
  <div class="offer">🎉 1 WEEK FREE TRIAL 🎉</div>
  
  <h4>Select Your Plan</h4>
  <select id="plan" onchange="updateAmount()">
    <option value="199">1 Camera - ₹199/month</option>
    <option value="999">Staff Pack - 10 Cameras - ₹999/month</option>
    <option value="1999">Company Pack - 25 Cameras - ₹1999/month</option>
  </select>
  
  <h3>Total: ₹<span id="amount">199</span>/month</h3>
  
  <p><b>Step 1:</b> Scan & Pay UPI</p>
  <img src="aapka-qr.png" width="220" class="qr">
  
  <h4><b>Step 2:</b> Details Bharo</h4>
  <input type="text" id="name" placeholder="Shop/Company Name">
  <input type="tel" id="phone" placeholder="WhatsApp Number">
  <input type="email" id="email" placeholder="Email ID">
  
  <button onclick="submitOrder()">Payment Ho Gayi - WhatsApp Karo</button>
  <p id="msg" style="color:green;"></p>
</div>

<script>
function updateAmount(){
  document.getElementById('amount').innerText = document.getElementById('plan').value;
}
function submitOrder(){
  let name = document.getElementById('name').value;
  let phone = document.getElementById('phone').value;
  let email = document.getElementById('email').value;
  let planText = document.getElementById('plan').options[document.getElementById('plan').selectedIndex].text;
  let amount = document.getElementById('amount').innerText;
  if(name=="" || phone=="" || email==""){ alert("Kripya sabhi details bharen"); return; }
  document.getElementById('msg').innerHTML = "Dhanyawad "+name+"! Order mil gaya.";
  let orderMsg = `🔔 NEW ORDER SA\nShop: ${name}\nPhone: ${phone}\nEmail: ${email}\nPlan: ${planText}\nAmount: ₹${amount}`;
  let whatsappLink = `https://wa.me/918465014514?text=${encodeURIComponent(orderMsg)}`;
  setTimeout(()=>{ window.open(whatsappLink, '_blank'); }, 1000);
}
</script>
</body>
</html>
