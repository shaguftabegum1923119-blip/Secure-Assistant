<!DOCTYPE html>
<html lang="hi">
<head>
<title>Secure Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { font-family: Arial; text-align: center; padding: 20px; background: #f5f5f5; }
.box { background: white; padding: 25px; border-radius: 12px; max-width: 600px; margin: auto; }
h1 { color: #673AB7; }
.btn { padding: 14px 28px; margin: 10px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
.upl { background: #673AB7; color: white; }
.whatsapp { background: #25D366; color: white; }
.timing { background: #EBF5E9; padding: 15px; border-radius: 8px; margin: 15px 0; }
.services { text-align: left; background: #F3E5F5; padding: 15px; border-radius: 8px; }
#chat-messages { height: 220px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; }
.qr { margin: 15px 0; border: 2px dashed #673AB7; padding: 10px; border-radius: 10px; }
input { border-radius: 8px; border: 1px solid #ccc; padding: 10px; }
img.logo { width: 120px; margin-bottom: 15px; }
</style>
</head>
<body>
<div class="box">
<img src="logo.png" alt="Secure Assistant Logo" class="logo">
<h1>Secure Assistant</h1>
<p>Your Smart Security Companion</p>

<div class="timing">
<b>Working Hours:</b> 9 AM to 9 PM
</div>

<div class="services">
<b>Our Services:</b><br>
- Home Security<br>
- CCTV Installation<br>
- 24/7 Monitoring
</div>

<button class="btn upl">Upload</button>
<button class="btn whatsapp">WhatsApp</button>

<div id="chat-messages"></div>

</div>
</body>
</html>
