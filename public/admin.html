<!DOCTYPE html>
<html>
<head>
  <title>Admin Login - SA</title>
  <style>
    body{font-family:Arial; text-align:center; background:#000; color:#FFD700;}
    .box{background:#111; padding:30px; border-radius:15px; margin:50px auto; width:90%; max-width:350px; border:2px solid #FFD700;}
    input{padding:12px; width:90%; margin:8px 0; border-radius:8px; border:none; background:#222; color:#FFD700;}
    button{background:#FFD700; color:#000; padding:12px 25px; border:none; border-radius:8px; font-weight:bold; cursor:pointer;}
  </style>
</head>
<body>
  <div class="box">
    <img src="logo.png" width="100"><br>
    <h2>Admin Login</h2>
    <form method="POST" action="/login">
      <input type="email" name="email" placeholder="Email" required><br>
      <input type="password" name="password" placeholder="Password" required><br>
      <button type="submit">Login</button>
    </form>
    <p style="font-size:12px; margin-top:20px;">Support: 8465014514</p>
  </div>
</body>
</html>
