<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><title>Admin</title><style>body{font-family:Arial;background:#f0f2f5;padding:20px}.box{background:#fff;padding:30px;border-radius:10px;max-width:900px;margin:30px auto}input,button{width:100%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:5px}button{background:#28a745;color:#fff;border:none}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{border:1px solid #ddd;padding:10px}th{background:#667eea;color:#fff}.btn{background:#28a745;color:#fff;padding:5px 10px;border:none;border-radius:3px}</style></head><body><div class="box" id="l"><h2>Admin Login</h2><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="e" style="color:red"></p></div><div class="box" id="d" style="display:none"><h2>Pending</h2><table id="t"><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>UPI</th><th>Status</th><th></th></tr></thead><tbody></tbody></table></div><script>async function login(){const r=await fetch('/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});const j=await r.json();if(j.success){l.style.display='none';d.style.display='block';load()}else{e.innerText="Galat"}}async function load(){const r=await fetch('/admin-data');const j=await r.json();t.querySelector('tbody').innerHTML='';j.forEach(x=>{t.querySelector('tbody').innerHTML+=`<tr><td>${x.id}</td><td>${x.name}</td><td>${x.email}</td><td>${x.phone}</td><td>${x.upi}</td><td>${x.status}</td><td>${x.status=='pending'?`<button class="btn" onclick="a(${x.id})">Approve</button>`:'-'}</td></tr>`})}}async function a(id){await fetch('/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});load()}</script></body></html>
