<!DOCTYPE html>
<html>
<head>
<title>Admin Panel - Secure Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:sans-serif; background:#f0f2f5; padding:20px; text-align:center}
h1{color:#25D366}
.card{background:white; padding:15px; border-radius:10px; margin:10px auto; max-width:400px; box-shadow:0 2px 4px #ccc; text-align:left}
button{background:#25D366; color:white; border:none; padding:10px 20px; border-radius:6px; cursor:pointer; font-size:16px; font-weight:bold}
button:hover{background:#1ebe5a}
</style>
</head>
<body>

<h1>🔒 Admin Panel</h1>
<p>Yaha pending payments aayenge. Approve karte hi list se hat jayenge.</p>

<div id="paymentList">Loading payments...</div>

<script>
// Page load hote hi data mangwao
window.onload = loadPayments;

function loadPayments(){
    fetch('/admin-data')
    .then(res => res.json())
    .then(data => {
        if(data.length === 0){
            document.getElementById("paymentList").innerHTML = "<p>Abhi koi pending payment nahi hai ✅</p>";
            return;
        }
        let html = "";
        data.forEach(p => {
            html += `
            <div class="card">
                <b>Amount:</b> ₹${p.amount} <br>
                <b>Txn ID:</b> ${p.txn} <br>
                <b>Time:</b> ${p.time} <br><br>
                <button onclick="approve('${p.txn}')">✅ Approve Karo</button>
            </div>
            `;
        });
        document.getElementById("paymentList").innerHTML = html;
    }).catch(err => {
        document.getElementById("paymentList").innerHTML = "<p>Error: Pehle Admin Login karein</p>";
    });
}

function approve(txn){
    if(confirm("Pakka Approve karna hai?")){
        fetch('/approve', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({txn: txn})
        })
        .then(res => res.json())
        .then(d => {
            alert("Approve ho gaya!");
            loadPayments(); // List refresh
        });
    }
}
</script>

</body>
</html>
