<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Admin Login - Secure Assistant</title>
<style>
body{font-family: Arial, sans-serif; background: linear-gradient(135deg, #25D366, #128C7E); display:flex; justify-content:center; align-items:center; height:100vh; margin:0}
.box{background:white; padding:40px; border-radius:15px; box-shadow:0 5px 20px rgba(0,0,0,0.2); width:320px; text-align:center}
h2{color:#128C7E; margin-bottom:20px}
input{width:100%; padding:12px; margin:10px 0; border:2px solid #ddd; border-radius:8px; box-sizing:border-box}
button{width:100%; padding:12px; background:#25D366; color:white; border:none; border-radius:8px; font-size:16px; font-weight:bold; cursor:pointer}
button:hover{background:#128C7E}
</style>
</head>
<body>
<div class="box">
<h2>🔒 Admin Login</h2>
<form action="/admin/login" method="POST">
<input type="text" name="username" placeholder="Username" required>
<input type="password" name="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>
</div>
</body>
</html>
