<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Secure Assistant</title>
<style>
  body{font-family:Arial, sans-serif;background:#f5f7fb;margin:0;padding:20px}
  .card{max-width:520px;margin:20px auto;background:#fff;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.08);padding:20px}
  .logo-wrap{text-align:center;margin-bottom:10px}
  .logo-wrap img{width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid #eee}
  h2{text-align:center;color:#333;margin:0 0 10px 0}
  .sub{text-align:center;color:#666;font-size:13px;margin-bottom:15px}
  label{display:block;margin:10px 0 6px;font-size:14px;font-weight:600}
  input,select{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px;box-sizing:border-box}
  button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer;font-size:16px}
  button:hover{background:#1d4ed8}
  .note{font-size:12px;color:#666;margin-top:10px;text-align:center}
  .upi-box{background:#eff6ff;border:1px solid #bfdbfe;padding:12px;border-radius:8px;margin:10px 0;font-size:14px}
  .admin-link{display:block;text-align:center;margin-top:20px;font-size:13px}
</style>
</head>
<body>

<div class="card">
  <!-- LOGO YAHAN AAYEGA -->
  <div class="logo-wrap">
    <img src="/logo.png" alt="Secure Assistant Logo">
  </div>

  <h2>🔒 Secure Assistant</h2>
  <div class="sub">₹99 Payment ke baad form submit karein</div>

  <div class="upi-box">
    <b>Payment karein:</b><br>
    <b>UPI ID:</b> aapka-upi@upi<br>
    <b>WhatsApp:</b> +91 aapka-number
  </div>

  <form id="f">
    <label>Full Name</label>
    <input name="name" required>

    <label>Phone Number</label>
    <input name="phone" required>

    <label>Email</label>
    <input name="email" type="email" required>

    <label>Transaction ID / UPI Ref</label>
    <input name="txnid" required>

    <label>Payment Screenshot Upload</label>
    <input name="screenshot" type="file">

    <button type="submit">Submit & Pay ₹99</button>
  </form>

  <div id="msg" class="note"></div>
  <a class="admin-link" href="/admin">Admin Login</a>
</div>

<script>
document.getElementById('f').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const fd = new FormData(e.target);
  const res = await fetch('/submit', {method:'POST', body: fd});
  const data = await res.json();
  document.getElementById('msg').textContent = data.ok ? '✅ Submit ho gaya! ID: '+data.id : '❌ Error: '+data.error;
  if(data.ok) e.target.reset();
});
</script>

</body>
</html>
