<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Assistant - Registration</title>
<style>
    body { font-family: Arial; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px #ccc; width: 350px; }
    input, button { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 5px; }
    button { background: #28a745; color: white; border: none; cursor: pointer; font-size: 16px; }
    button:hover { background: #218838; }
    .upi { background: #e7f3ff; padding: 10px; border-radius: 5px; text-align: center; margin: 10px 0; }
</style>
</head>
<body>
<div class="box">
    <h2>Secure Assistant Registration</h2>
    <p>Approval ke liye ₹99 fees hai</p>
    <div class="upi">
        <b>UPI ID:</b> aapki-upi@upi<br>
        <b>WhatsApp:</b> aapka-number
    </div>
    <form id="regForm">
        <input type="text" id="name" placeholder="Aapka Naam" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="text" id="upi" placeholder="Payment UPI / Transaction ID" required>
        <button type="submit">Submit for Approval</button>
    </form>
    <p id="msg"></p>
</div>

<script>
document.getElementById('regForm').onsubmit = async (e) => {
    e.preventDefault();
    const data = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        upi: document.getElementById('upi').value
    };
    const res = await fetch('/save', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    });
    const result = await res.json();
    if(result.success){
        document.getElementById('msg').innerHTML = "Ho gaya! Admin approval ka wait kare. ID: " + result.id;
        document.getElementById('regForm').reset();
    }
}
</script>
</body>
</html>
