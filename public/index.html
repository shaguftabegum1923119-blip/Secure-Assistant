<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Secure Assistant</title>
<style>
body{font-family:Arial;background:#f5f7fb;margin:0;padding:20px}
.card{max-width:520px;margin:20px auto;background:#fff;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.08);padding:20px}
.logo-wrap{text-align:center}.logo-wrap img{width:80px;height:80px;border-radius:50%;border:2px solid #eee}
h2{text-align:center;color:#333;margin:10px 0}
.upi-box{background:#eff6ff;border:1px solid #bfdbfe;padding:12px;border-radius:8px;margin:10px 0;text-align:center}
label{display:block;margin:10px 0 6px;font-size:14px;font-weight:600}
input{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:700;font-size:16px}
</style>
</head>
<body>
<div class="card">
  <div class="logo-wrap"><img src="/logo.png" alt="Logo"></div>
  <h2>🔒 Secure Assistant</h2>
  <div class="upi-box"><b>Payment karein:</b><br><b>UPI ID:</b> 9876543210@paytm</div>
  <form id="f">
    <label>Full Name</label><input name="name" required>
    <label>Phone Number</label><input name="phone" required>
    <label>Email</label><input name="email" type="email" required>
    <label>Transaction ID</label><input name="txnid" required>
    <label>Payment Screenshot</label><input name="screenshot" type="file">
    <button type="submit">Submit & Pay ₹99</button>
  </form>
  <div id="msg" style="text-align:center;margin-top:10px"></div>
  <a href="/admin" style="display:block;text-align:center;margin-top:20px;font-size:12px;color:#888">Admin</a>
</div>
<script>
document.getElementById('f').addEventListener('submit', async (e)=>{
e.preventDefault(); const fd = new FormData(e.target);
const res = await fetch('/submit', {method:'POST', body: fd}); const data = await res.json();
document.getElementById('msg').textContent = data.ok ? '✅ Submit ho gaya! ID: '+data.id : '❌ Error';
});
</script>
</body>
</html>
