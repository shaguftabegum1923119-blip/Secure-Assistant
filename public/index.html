<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure Assistant</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}.box{background:#fff;padding:30px;border-radius:15px;width:100%;max-width:400px}h2{text-align:center}.fee{text-align:center;color:red;font-weight:bold}.upi{background:#e7f3ff;padding:15px;border-radius:8px;text-align:center;margin:15px 0;border:2px dashed #3498db}input{width:100%;padding:12px;margin:10px 0;border:2px solid #ddd;border-radius:8px}button{width:100%;padding:14px;background:#667eea;color:#fff;border:none;border-radius:8px;font-weight:bold}#msg{text-align:center;margin-top:15px;font-weight:bold}.ok{color:green}</style></head><body><div class="box"><h2>🔒 Secure Assistant</h2><p class="fee">Approval Fees: ₹99</p><div class="upi"><b>UPI:</b> YAHAN-UPI<br><b>WA:</b> +91 YAHAN-NUMBER</div><form id="f"><input id="n" placeholder="Pura Naam" required><input id="e" placeholder="Email" required><input id="p" placeholder="Mobile" required><input id="u" placeholder="UPI Txn ID" required><button>Submit</button></form><p id="msg"></p><p style="text-align:center;margin-top:15px"><a href="/admin">Admin Login</a></p></div><script>f.onsubmit=async(e)=>{e.preventDefault();msg.innerHTML="Bhej rahe...";const r=await fetch('/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n.value,email:e.value,phone:p.value,upi:u.value})});const d=await r.json();if(d.success){msg.innerHTML="✅ Ho gaya! ID: "+d.id;msg.className="ok";f.reset()}else{msg.innerHTML="❌ Error"}}</script></body></html>
